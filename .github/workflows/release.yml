name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GOOS" = darwin ]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
            arch=arm64; [ "$GOARCH" = amd64 ] && arch=x86_64
            export CC="clang -arch $arch -mmacosx-version-min=12.0"
            export CGO_LDFLAGS="-mmacosx-version-min=12.0"
          fi
          go build -trimpath -tags sqlite_fts5 -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o kioku .
          mkdir -p dist
          tar -czf "dist/kioku_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" kioku LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: kioku-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre
